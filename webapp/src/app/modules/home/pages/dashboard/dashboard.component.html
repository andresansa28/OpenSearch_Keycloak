<div *ngIf="loading" style="text-align:center; margin:2em;">
  <mat-spinner></mat-spinner>
</div>

<div *ngIf="!loading">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z2" style="width:100%;">

    <!-- Container Name -->
    <ng-container matColumnDef="container">
      <th mat-header-cell *matHeaderCellDef>Container</th>
      <td mat-cell *matCellDef="let row">{{ row.container }}</td>
    </ng-container>

    <!-- Ports -->
    <ng-container matColumnDef="ports">
      <th mat-header-cell *matHeaderCellDef>Porte scansionate (conteggio)</th>
      <td mat-cell *matCellDef="let row">
        <ng-container *ngIf="row.ports.length; else noPorts">
          <span *ngFor="let p of row.ports; let last = last">
            <b>{{p.port}}</b> ({{p.count}}) <span *ngIf="!last">, </span>
          </span>
        </ng-container>
        <ng-template #noPorts><i>Nessuna</i></ng-template>
      </td>
    </ng-container>

    <!-- Total Scans -->
    <ng-container matColumnDef="totalScans">
      <th mat-header-cell *matHeaderCellDef>Scansioni totali</th>
      <td mat-cell *matCellDef="let row">{{ row.totalScans }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
