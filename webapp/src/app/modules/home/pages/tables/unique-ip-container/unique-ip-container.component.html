<div class="dashboard-table-container table-container">
  <!-- Stato di Caricamento -->
  <div *ngIf="isLoading" class="status-indicator-unique loading-state">
    <mat-spinner diameter="50" class="loading-spinner"></mat-spinner>
    <p class="status-message">Caricamento dati...</p>
  </div>

  <!-- Stato di Errore -->
  <div *ngIf="!isLoading && hasError" class="status-indicator-unique error-state">
    <mat-icon class="error-icon">error_outline</mat-icon>
    <p class="status-message error-text">Errore nel caricamento dei dati. Riprova più tardi.</p>
  </div>

  <!-- Stato con Dati -->
  <div *ngIf="!isLoading && !hasError && tableData.length > 0" class="data-content">
    <div *ngFor="let container of tableData" class="container-table-wrapper">
  <table mat-table [dataSource]="container.values" class="mat-elevation-z8 inner-table data-table">

    <!-- Header Titolo Tabella -->
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef colspan="2" class="table-title-header table-main-header">
        {{container.container}}
      </th>
    </ng-container>

    <!-- Colonna Etichetta -->
    <ng-container matColumnDef="label">
      <th mat-header-cell *matHeaderCellDef class="column-header label-header">Tipologia Connessione</th>
      <td mat-cell *matCellDef="let row" class="data-cell label-cell">
        <span
          class="status-label"
          [ngClass]="{
            'status-benign': row.label?.toLowerCase() === 'benign',
            'status-malicious': row.label?.toLowerCase() === 'malicious',
            'status-unknown': row.label?.toLowerCase() === 'unknown'
          }">
          {{ row.label }}
        </span>
      </td>
    </ng-container>

    <!-- Colonna Valore -->
    <ng-container matColumnDef="value">
      <th mat-header-cell *matHeaderCellDef class="column-header value-header">Ip Unici</th>
      <td mat-cell *matCellDef="let row" class="data-cell value-cell">
        <span
          class="status-label"
          [ngClass]="{
            'status-benign': row.label?.toLowerCase() === 'benign',
            'status-malicious': row.label?.toLowerCase() === 'malicious',
            'status-unknown': row.label?.toLowerCase() === 'unknown'
          }">
          {{ row.value }}
        </span>
      </td>
    </ng-container>

    <!-- Header + righe -->
    <tr mat-header-row *matHeaderRowDef="['title']" class="title-row main-title-row"></tr>
    <tr mat-header-row *matHeaderRowDef="['label', 'value']" class="subheader-row"></tr>
    <tr mat-row *matRowDef="let row; columns: ['label', 'value']" class="data-row"></tr>
  </table>
</div>

  </div>

  <!-- Stato Vuoto -->
  <div *ngIf="!isLoading && !hasError && tableData.length === 0" class="status-indicator-unique empty-state">
    <mat-icon class="empty-icon">info_outline</mat-icon>
    <p class="status-message empty-text">Nessun dato disponibile per il tenant selezionato.</p>
  </div>
</div>
